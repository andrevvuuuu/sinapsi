<!DOCTYPE html>
<html lang="it" data-theme="lavagna">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafo unito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--ease-out:cubic-bezier(.23,1,.32,1);--serif:'Instrument Serif',Georgia,serif;--sans:'Geist',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
[data-theme="lavagna"]{color-scheme:dark;--bg:#0f100d;--surface:#171814;--hair:rgba(236,233,223,.10);--ink:#ece9df;--muted:#a19e92;--faint:rgba(236,233,223,.055);--accent:#ef7a42;--good:#8fd1a6;--warn:#e9b95f;--bad:#f08080;--pen:#8fb8ff;--inner:inset 0 1px 0 rgba(236,233,223,.06);--shadow:0 30px 60px -30px rgba(0,0,0,.8)}
[data-theme="trattato"]{color-scheme:light;--bg:#f3eee4;--surface:#fbf8f2;--hair:rgba(36,32,27,.12);--ink:#221e19;--muted:#615a4f;--faint:rgba(36,32,27,.05);--accent:#a83d22;--good:#2f6e48;--warn:#8f6512;--bad:#a8323f;--pen:#2f55a8;--inner:inset 0 1px 0 rgba(255,255,255,.85);--shadow:0 30px 60px -34px rgba(80,60,30,.35)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:grab}
canvas.hov{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
button{font:inherit;color:inherit}
.glass{background:color-mix(in srgb,var(--surface) 86%,transparent);border:1px solid var(--hair);box-shadow:var(--inner),var(--shadow);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.panel{position:fixed;top:16px;left:16px;z-index:5;width:304px;max-height:calc(100vh - 32px);overflow:auto;border-radius:22px;padding:14px}
.panel h1{font:400 30px/1 var(--serif);margin:2px 4px 4px}
.meta{font:500 12px var(--mono);color:var(--muted);margin:0 4px 12px;line-height:1.5}
.search{position:relative}
.search input{width:100%;min-height:44px;border-radius:14px;border:1px solid var(--hair);background:var(--faint);color:var(--ink);font:inherit;padding:0 14px 0 38px}
.search input::placeholder{color:var(--muted)}
.search input:focus-visible{outline:none;border-color:var(--accent)}
.search svg{position:absolute;left:12px;top:14px;width:16px;height:16px;color:var(--muted)}
#results{list-style:none;margin:6px 0 0;padding:0}
#results button{width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:0 10px;border:0;border-radius:10px;background:transparent;text-align:left;cursor:pointer;font-size:14px}
#results button:hover,#results button[aria-selected="true"]{background:var(--faint)}
#results i{width:9px;height:9px;border-radius:50%;flex:none}
#results small{margin-left:auto;font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.sec{margin-top:14px;padding-top:12px;border-top:1px solid var(--hair)}
.sec h2{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
.seg{display:flex;gap:2px;padding:3px;border-radius:12px;background:var(--faint)}
.seg button{flex:1;min-height:36px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 0 var(--hair)}
.hint{font-size:12.5px;color:var(--muted);margin:8px 4px 0;line-height:1.45}
.lens{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.lens button{min-height:36px;border-radius:10px;border:1px solid transparent;background:transparent;cursor:pointer;font-size:13px;color:var(--muted);text-align:left;padding:0 10px;display:flex;align-items:center;gap:6px}
.lens button[aria-pressed="true"]{background:var(--faint);color:var(--ink);border-color:var(--hair)}
.lens button b{margin-left:auto;font:500 11px var(--mono)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:38px;padding:0 4px;font-size:14px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left}
.tog .sw{flex:none;width:36px;height:22px;border-radius:999px;background:var(--hair);position:relative;transition:background-color .25s var(--ease-out)}
.tog .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease-out)}
.tog[aria-pressed="true"] .sw{background:var(--good)} .tog[aria-pressed="true"] .sw::after{transform:translateX(14px)}
.tog small{color:var(--muted);font:500 11px var(--mono)}
.legend ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:10px}
.legend svg{width:30px;height:20px;flex:none}
.zoom{position:fixed;right:16px;bottom:18px;z-index:5;display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:18px}
.zoom button{width:42px;height:42px;border:0;border-radius:14px;background:transparent;cursor:pointer;font:500 18px var(--mono);color:var(--muted)}
.zoom button:hover{background:var(--faint);color:var(--ink)}
.theme{position:fixed;right:16px;top:16px;z-index:5;display:flex;gap:2px;padding:4px;border-radius:999px}
.theme button{width:40px;height:40px;border:0;border-radius:999px;background:transparent;cursor:pointer;color:var(--muted)}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.crumbs{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:4px;padding:4px 6px;border-radius:999px;font-size:13px}
.crumbs span{padding:6px 12px;border-radius:999px;color:var(--muted);white-space:nowrap;transition:all .3s var(--ease-out)}
.crumbs span.on{background:var(--ink);color:var(--bg)}
.crumbs i{color:var(--muted);font-style:normal;opacity:.5}
.card{position:fixed;top:72px;right:16px;z-index:6;width:350px;max-height:calc(100vh - 100px);overflow:auto;border-radius:24px;padding:20px;transform:translateX(16px);opacity:0;pointer-events:none;transition:transform .35s var(--ease-out),opacity .25s}
.card.show{transform:none;opacity:1;pointer-events:auto}
.card .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:18px}
.card .x:hover{background:var(--faint)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;padding-right:36px}
.chips span{font:500 11px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--hair);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chips i{width:8px;height:8px;border-radius:50%}
.card h3{font:400 28px/1.08 var(--serif);margin:0 0 8px;text-wrap:balance}
.card .stmt{font-size:15px;margin:0 0 12px;padding:12px 14px;border-radius:14px;background:var(--faint)}
.card p{margin:0 0 10px;color:var(--muted);font-size:14px}
.card p b{color:var(--ink);font-weight:500}
.card h4{font:600 11px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.word{display:inline-block;font:500 12px var(--mono);padding:3px 10px;border-radius:999px;margin:0 6px 10px 0}
.rows{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.rows button,.rows li.s{width:100%;text-align:left;padding:8px 10px;border-radius:10px;background:var(--faint);border:0;cursor:pointer;font-size:14px;display:flex;gap:8px;align-items:center}
.rows li.s{cursor:default}
.rows button:hover{background:color-mix(in srgb,var(--ink) 9%,transparent)}
.rows i{width:8px;height:8px;border-radius:50%;flex:none}
.rows small{margin-left:auto;font:500 11px var(--mono);color:var(--muted);white-space:nowrap}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.acts button{min-height:42px;border-radius:12px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:14px;padding:0 10px}
.acts button.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);grid-column:1/-1}
.membar{height:6px;border-radius:6px;background:var(--hair);overflow:hidden;margin:4px 0 6px}
.membar i{display:block;height:100%;border-radius:6px}
.mix{display:flex;height:8px;border-radius:6px;overflow:hidden;margin:6px 0 4px;gap:2px}
.mix i{display:block;height:100%}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,10px);z-index:7;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:all .3s var(--ease-out);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.card,.toast,.crumbs span{transition:none}}
</style>
</head>
<body>
<canvas id="cv" role="img" aria-label="Grafo unito: materie, note e concetti. Usa la ricerca per selezionare."></canvas>

<nav class="crumbs glass" aria-label="Livello di zoom"><span id="z0">Materie</span><i>›</i><span id="z1">Note</span><i>›</i><span id="z2">Concetti</span></nav>

<section class="panel glass" aria-label="Controlli del grafo">
  <h1>Grafo</h1>
  <div class="meta" id="meta"></div>
  <div class="search">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
    <input id="q" type="search" placeholder="Cerca un concetto o una nota" aria-label="Cerca nel grafo" aria-controls="results" autocomplete="off">
  </div>
  <ul id="results" role="listbox" aria-label="Risultati"></ul>

  <div class="sec">
    <h2>Disposizione</h2>
    <div class="seg" role="group" aria-label="Disposizione">
      <button type="button" data-lay="radial" aria-pressed="true">Radiale</button>
      <button type="button" data-lay="vertical" aria-pressed="false">A piani</button>
      <button type="button" data-lay="free" aria-pressed="false">Libera</button>
    </div>
    <p class="hint" id="layHint"></p>
  </div>

  <div class="sec">
    <h2>Evidenzia</h2>
    <div class="lens" role="group" aria-label="Evidenzia">
      <button type="button" data-lens="all" aria-pressed="true">Tutto</button>
      <button type="button" data-lens="weakbase" aria-pressed="false">Basi fragili<b id="nWB"></b></button>
      <button type="button" data-lens="due" aria-pressed="false">Da ripassare<b id="nDue"></b></button>
      <button type="button" data-lens="never" aria-pressed="false">Mai visti<b id="nNever"></b></button>
    </div>
  </div>

  <div class="sec">
    <h2>Mostra</h2>
    <button type="button" class="tog" id="tReg" aria-pressed="true"><span>Regioni (una per nota)</span><span class="sw" aria-hidden="true"></span></button>
    <button type="button" class="tog" id="tWl" aria-pressed="true"><span>Link scritti in Obsidian</span><span class="sw" aria-hidden="true"></span></button>
    <button type="button" class="tog" id="tFr" aria-pressed="true"><span>Frontiera <small id="nFr"></small></span><span class="sw" aria-hidden="true"></span></button>
  </div>

  <div class="sec legend">
    <h2>Come leggerlo</h2>
    <ul>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><circle cx="15" cy="10" r="5" fill="#8fd1a6"/></svg>Concetto che sai</li>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><circle cx="15" cy="10" r="5" fill="#e9b95f"/></svg>Incerto</li>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><circle cx="15" cy="10" r="5" fill="#8fb8ff"/></svg>Accettato senza capirlo</li>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><circle cx="15" cy="10" r="4.3" fill="none" stroke="#a19e92" stroke-width="1.6"/></svg>Nelle tue note, mai studiato</li>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><circle cx="15" cy="10" r="7" fill="#ece9df"/><circle cx="15" cy="10" r="10" fill="none" stroke="#ece9df" stroke-opacity=".4" stroke-dasharray="2 2"/></svg>Più grande: compare in più note</li>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><path d="M2 4 L14 10 M2 16 L14 10 L26 10" stroke="#ece9df" stroke-width="1.3" fill="none"/><path d="M26 10 l-5 -3 v6z" fill="#ece9df"/></svg>Premesse ⇒ conclusione</li>
      <li><svg viewBox="0 0 30 20" aria-hidden="true"><path d="M3 14 Q15 0 27 14" stroke="#a19e92" stroke-width="1.3" stroke-dasharray="3 3" fill="none"/></svg>Link scritto da te in Obsidian</li>
    </ul>
  </div>
</section>

<div class="theme glass" role="group" aria-label="Tema">
  <button type="button" data-t="lavagna" aria-pressed="true" aria-label="Tema scuro">◐</button>
  <button type="button" data-t="trattato" aria-pressed="false" aria-label="Tema chiaro">◑</button>
</div>
<div class="zoom glass" role="group" aria-label="Zoom">
  <button type="button" id="zIn" aria-label="Avvicina">+</button>
  <button type="button" id="zOut" aria-label="Allontana">−</button>
  <button type="button" id="zFit" aria-label="Mostra tutto">⤢</button>
</div>
<aside class="card glass" id="card" aria-live="polite" aria-label="Dettagli"></aside>
<div class="toast glass" id="toast" role="status"></div>

let LAY='radial';
function clusterPull(strength){let ns;function f(alpha){const cen={};for(const p of props){const c=cen[p.note]||(cen[p.note]={x:0,y:0,n:0});c.x+=p.x;c.y+=p.y;c.n++}
  for(const k in cen){cen[k].x/=cen[k].n;cen[k].y/=cen[k].n}for(const p of props){const c=cen[p.note];p.vx+=(c.x-p.x)*strength*alpha;p.vy+=(c.y-p.y)*strength*alpha}}f.initialize=n=>ns=n;return f}
function depthForce(){function f(alpha){const k=.8*alpha;for(const n of nodes){if(n.kind!=='p'&&n.kind!=='i')continue;
  if(LAY==='radial'){const r=BASE+n.d*SPACING,d=Math.hypot(n.x,n.y)||1,dr=(r-d)*k*.12;n.vx+=n.x/d*dr;n.vy+=n.y/d*dr;
    if(n.kind==='p'){const a=noteAng[n.note];n.vx+=(Math.cos(a)*r-n.x)*k*.035;n.vy+=(Math.sin(a)*r-n.y)*k*.035}}
  else if(LAY==='vertical'){const ty=260-n.d*SPACING*1.25;n.vy+=(ty-n.y)*k*.12}}}return f}

  .force('gy',d3.forceY(n=>n.kind==='n'?(SC[n.s]||{y:0}).y:n.kind==='g'&&n.course==='Algebra Lineare'?LCY:0).strength(n=>n.kind==='n'?.08:n.kind==='g'?(n.course==='Algebra Lineare'?.04:0):LAY==='free'?.04:0))

  .stop();

function regions(alpha){const sc=.25;off.width=Math.ceil(Wd*sc);off.height=Math.ceil(Hd*sc);octx.clearRect(0,0,off.width,off.height);
  octx.globalCompositeOperation='source-over';

  ctx.save();ctx.globalAlpha=alpha*(dark?.2:.26);ctx.filter='blur('+Math.max(8,40*Math.min(1.4,T.k))+'px)';ctx.drawImage(off,0,0,Wd,Hd);ctx.filter='none';ctx.restore()}
function hulls(alpha){ctx.save();ctx.setLineDash([3,5]);ctx.lineWidth=1;
  for(const n of NOTES){const pts=[];for(const p of props){if(p.note!==n.id)continue;const r=26;for(let a=0;a<6;a++)pts.push([sx(p.x+Math.cos(a*1.047)*r),sy(p.y+Math.sin(a*1.047)*r)])}
    const h=d3.polygonHull(pts);if(!h)continue;ctx.beginPath();h.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.strokeStyle=rgba(n.h,alpha*.55);ctx.stroke();n._hull=h}
  ctx.restore()}
function centroid(id){let x=0,y=0,c=0;for(const p of props)if(p.note===id){x+=p.x;y+=p.y;c++}return{x:x/c,y:y/c}}

function focusSets(){
  if(S.path)return{nodes:S.path.set,edgesOk:(a,b)=>S.path.set.has(a)&&S.path.set.has(b)};
  const f=S.hov||S.sel;if(!f)return null;
  if(f.kind==='p'){const set=new Set([f.id]);(parents[f.id]||[]).forEach(x=>set.add(x));(kids[f.id]||[]).forEach(x=>set.add(x));return{nodes:set,edgesOk:(a,b)=>(a===f.id||b===f.id),note:null}}
  if(f.kind==='note'){const set=new Set(props.filter(p=>p.prov.includes(f.id)).map(p=>p.id));return{nodes:set,edgesOk:(a,b)=>set.has(a)&&set.has(b),note:f.id}}
  if(f.kind==='n'){return{nodes:new Set([f.id]),edgesOk:()=>false}}
  return null}

function draw(now){
  const k=T.k;
  const tSubj=1-ease((k-.3)/.18), tNote=ease((k-.34)/.16)*(1-ease((k-1.25)/.45)), tProp=ease((k-1.15)/.5);
  ['z0','z1','z2'].forEach((z,i)=>$(z).classList.toggle('on',[tSubj,tNote,tProp][i]===Math.max(tSubj,tNote,tProp)));
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=C.bg;ctx.fillRect(0,0,Wd,Hd);
  const F=focusSets(), dimOf=id=>F&&!F.nodes.has(id)?.13:1, lensOn=S.lens!=='all';
  const lensHit=p=>S.lens==='weakbase'?weakBase(p):S.lens==='due'?dueP(p):S.lens==='never'?p.u==='not':true;
  // depth rings (radial) — the edge of what you know
  if(LAY==='radial'){ctx.save();ctx.strokeStyle=rgba(C.ink,.05);ctx.lineWidth=1;for(let d=0;d<=maxD;d++){ctx.beginPath();ctx.arc(sx(0),sy(0),(BASE+d*SPACING)*k,0,7);ctx.stroke()}
    ctx.setLineDash([2,6]);ctx.strokeStyle=rgba(C.ink,.16);ctx.beginPath();ctx.arc(sx(0),sy(0),(BASE+maxD*SPACING+60)*k,0,7);ctx.stroke();ctx.restore();
    if(k>.5){ctx.font='500 11px "Geist Mono",monospace';ctx.fillStyle=rgba(C.muted,.8);ctx.textAlign='center';ctx.fillText('limite di ciò che sai',sx(0),sy(-(BASE+maxD*SPACING+60))-8);ctx.fillText('basi',sx(0),sy(0)+4)}}
  if(S.reg){regions(1);if(tNote>.05&&tProp<.9)hulls(tNote)}
  // frontier
  if(S.fr){for(const g of [...FA,...FL]){ctx.beginPath();ctx.arc(sx(g.x),sy(g.y),Math.max(1,1.6*Math.sqrt(k)),0,7);ctx.fillStyle=rgba(scol('matematica'),F?.08:.35);ctx.fill()}
    if(k<1.4){ctx.textAlign='center';ctx.font='400 22px "Instrument Serif",serif';ctx.fillStyle=rgba(C.muted,.9);
      ctx.fillText('Algebra Lineare',sx(LCX),sy(LCY)-60*k-26);ctx.font='500 11px "Geist Mono",monospace';ctx.fillText('0 note scritte · '+FL.length+' previste dal MOC',sx(LCX),sy(LCY)-60*k-10)}}
  // Obsidian wikilinks between note regions (authored by you)
  if(S.wl&&tProp<.95){ctx.save();ctx.setLineDash([3,4]);ctx.lineWidth=1.2;
    for(const [a,b] of WLN){const A=centroid(a),B=centroid(b),mx=(A.x+B.x)/2,my=(A.y+B.y)/2,nx=-(B.y-A.y)*.18,ny=(B.x-A.x)*.18;
      const on=F&&F.note&&(a===F.note||b===F.note);ctx.strokeStyle=rgba(C.muted,(on?.75:.28)*(1-tProp));
      ctx.beginPath();ctx.moveTo(sx(A.x),sy(A.y));ctx.quadraticCurveTo(sx(mx+nx),sy(my+ny),sx(B.x),sy(B.y));ctx.stroke()}
    for(const l of owl){const a=l.source,b=l.target;ctx.strokeStyle=rgba(C.muted,.25);ctx.beginPath();ctx.moveTo(sx(a.x),sy(a.y));ctx.lineTo(sx(b.x),sy(b.y));ctx.stroke()}
    ctx.restore()}
  // chains (LH geometry: premises converge headless on the junction; one arrow leaves)
  ctx.lineWidth=1.15;
  for(const l of links){if(l.wl)continue;const a=l.source,b=l.target;
    const aid=a.kind==='i'?null:a.id,bid=b.kind==='i'?null:b.id;const im=a.kind==='i'?a:b.kind==='i'?b:null;
    let on=1;if(F){const [ps,c]=CH[l.ch],f=S.hov||S.sel;on=(S.path?(S.path.set.has(c)&&ps.every(x=>S.path.set.has(x))):f&&f.kind==='p'?(c===f.id||ps.includes(f.id)):f&&f.kind==='note'?(F.nodes.has(c)||ps.some(x=>F.nodes.has(x))):false)?1:.08}
    if(lensOn)on*=.5;
    const al=(.18+.5*tProp)*on;ctx.strokeStyle=rgba(C.ink,al);
    const x1=sx(a.x),y1=sy(a.y),x2=sx(b.x),y2=sy(b.y);
    if(l.head){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy)||1,ux=dx/L,uy=dy/L,er=pr(b)*Math.sqrt(k)*.9+2,ah=Math.max(3,6*Math.min(1.4,k));
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*(er+ah),y2-uy*(er+ah));ctx.stroke();
      if(k>.45){ctx.beginPath();ctx.moveTo(x2-ux*er,y2-uy*er);ctx.lineTo(x2-ux*(er+ah)-uy*ah*.5,y2-uy*(er+ah)+ux*ah*.5);ctx.lineTo(x2-ux*(er+ah)+uy*ah*.5,y2-uy*(er+ah)-ux*ah*.5);ctx.closePath();ctx.fillStyle=rgba(C.ink,al);ctx.fill()}}
    else{ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}}
  // other notes (Obsidian-style)
  for(const o of others){const X=sx(o.x),Y=sy(o.y),r=Math.max(2.5,(o.moc?9:5)*Math.sqrt(k));ctx.globalAlpha=F?(F.nodes.has(o.id)?1:.15):1;
    ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fillStyle=C.bg;ctx.fill();ctx.lineWidth=1.6;ctx.strokeStyle=scol(o.s);ctx.stroke();ctx.globalAlpha=1}
  // propositions
  const pulse=reduce?.5:(Math.sin(now/520)+1)/2;let anyDue=false;
  for(const p of props){const X=sx(p.x),Y=sy(p.y);if(X<-30||Y<-30||X>Wd+30||Y>Hd+30)continue;
    const r=Math.max(1.8,pr(p)*Math.sqrt(k)*.9);let a=dimOf(p.id);if(lensOn&&!lensHit(p))a=Math.min(a,.12);ctx.globalAlpha=a;
    const c=ucol(p.u);
    if(p.prov.length>1){ctx.beginPath();ctx.arc(X,Y,r+3.5,0,7);ctx.setLineDash([2,2]);ctx.strokeStyle=rgba(C.ink,.45);ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([])}
    if(p.u==='not'){ctx.beginPath();ctx.arc(X,Y,r-.7,0,7);ctx.fillStyle=C.bg;ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=c;ctx.stroke()}
    else{ctx.beginPath();ctx.arc(X,Y,r,0,7);ctx.fillStyle=c;ctx.fill()}
    if(dueP(p)&&a>.5){anyDue=true;ctx.beginPath();ctx.arc(X,Y,r+6+pulse*3,0,7);ctx.strokeStyle=rgba(C.warn,.25+.45*(1-pulse));ctx.lineWidth=1.2;ctx.stroke()}
    if(p===S.sel){ctx.beginPath();ctx.arc(X,Y,r+9,0,7);ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke()}
    if(p===S.hov){ctx.beginPath();ctx.arc(X,Y,r+12,0,7);ctx.fillStyle=rgba(c,.18);ctx.fill()}
    ctx.globalAlpha=1}
  // labels — the three zoom levels cross-fade (subjects › notes › concepts)
  ctx.textAlign='center';
  if(tSubj>.02){ctx.globalAlpha=tSubj;ctx.font='400 40px "Instrument Serif",serif';ctx.fillStyle=scol('matematica');ctx.fillText('Analisi 1',sx(0),sy(-RIM)-30);
    ctx.font='500 12px "Geist Mono",monospace';ctx.fillStyle=C.muted;ctx.fillText('9 note scritte · '+FA.length+' previste dal MOC',sx(0),sy(-RIM)-10);
    for(const s of subjOrder){const m=others.filter(o=>o.s===s);if(!m.length)continue;const X=sx(d3.mean(m,o=>o.x)),Y=sy(d3.mean(m,o=>o.y))-46;ctx.font='400 26px "Instrument Serif",serif';ctx.fillStyle=scol(s);ctx.fillText(SUBJ[s][0],X,Y);ctx.font='500 11px "Geist Mono",monospace';ctx.fillStyle=C.muted;ctx.fillText(m.length+' note · da importare',X,Y+16)}
    ctx.globalAlpha=1}
  if(tNote>.02){const placed=[];ctx.font='400 21px "Instrument Serif",serif';
    const order=NOTES.map(n=>{const c=centroid(n.id);return{n,X:sx(c.x),Y:sy(c.y)}}).sort((a,b)=>a.Y-b.Y);
    for(const o of order){const t=o.n.t.length>30?o.n.t.replace('Teorema di ','Teor. ').replace(' Relativi e Assoluti','').replace(' Fondamentali','').replace(' sui Punti Stazionari',''):o.n.t;const w=ctx.measureText(t).width+28;let tries=0;
      while(tries++<40&&placed.some(p=>Math.abs(p.X-o.X)<(p.w+w)/2+6&&Math.abs(p.Y-o.Y)<46))o.Y+=8;placed.push({X:o.X,Y:o.Y,w});o.n._p=[o.X,o.Y]}
    for(const n of NOTES){const X=n._p[0],Y=n._p[1];let a=tNote;if(F&&F.note&&F.note!==n.id)a*=.3;ctx.globalAlpha=a;
      const t=n.t.length>30?n.t.replace('Teorema di ','Teor. ').replace(' Relativi e Assoluti','').replace(' Fondamentali','').replace(' sui Punti Stazionari',''):n.t;
      ctx.font='400 21px "Instrument Serif",serif';const w=ctx.measureText(t).width+28;
      ctx.fillStyle=rgba(C.surface,.82);roundRect(X-w/2,Y-21,w,40,20);ctx.fill();ctx.strokeStyle=rgba(n.h,.7);ctx.lineWidth=1.2;ctx.stroke();
      ctx.fillStyle=C.ink;ctx.fillText(t,X,Y+1);ctx.font='500 10px "Geist Mono",monospace';ctx.fillStyle=C.muted;
      const ps=props.filter(p=>p.note===n.id);ctx.fillText(ps.length+' concetti · '+Math.round(n.m*100)+'%',X,Y+13);n._lab=[X-w/2,Y-21,w,40]}
    ctx.globalAlpha=1}else NOTES.forEach(n=>n._lab=null);
  if(tNote>.02){ctx.font='500 12px Geist,sans-serif';for(const o of others){if(tNote<.3)continue;ctx.globalAlpha=tNote*(F?.3:.85);ctx.fillStyle=C.muted;ctx.fillText(o.name.length>28?o.name.slice(0,26)+'…':o.name,sx(o.x),sy(o.y)+20)}ctx.globalAlpha=1}
  if(tProp>.02){ctx.font='500 12px Geist,sans-serif';for(const p of props){const X=sx(p.x),Y=sy(p.y);if(X<-150||X>Wd+150||Y<-20||Y>Hd+40)continue;
      let a=tProp*dimOf(p.id);if(lensOn&&!lensHit(p))a*=.2;if(p===S.hov||p===S.sel)a=1;if(a<.03)continue;ctx.globalAlpha=a;ctx.fillStyle=C.ink;
      wrap(p.name,X,Y+pr(p)*Math.sqrt(k)*.9+15,Math.max(110,26*k))}ctx.globalAlpha=1}
  return anyDue}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function wrap(t,x,y,w){const ws=t.split(' ');let line='',yy=y;for(const wd of ws){const tt=line?line+' '+wd:wd;if(ctx.measureText(tt).width>w&&line){ctx.fillText(line,x,yy);line=wd;yy+=15}else line=tt}ctx.fillText(line,x,yy)}
let pulsing=false;function loop(now){if(dirty||pulsing){pulsing=draw(now)&&!reduce;dirty=false}requestAnimationFrame(loop)}

// ── camera ──
const zoom=d3.zoom().scaleExtent([.08,6]).on('zoom',ev=>{T=ev.transform;dirty=true});
const sel=d3.select(cv).call(zoom).on('dblclick.zoom',null);
function fit(list){list=list||nodes.filter(n=>n.kind!=='i'&&(S.fr||n.kind!=='g'));const xs=list.map(n=>n.x),ys=list.map(n=>n.y);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const L0=336,R0=$('card').classList.contains('show')?380:16,cw=Wd-L0-R0;const kk=Math.min(3,.88*Math.min((cw-60)/Math.max(60,x1-x0),(Hd-100)/Math.max(60,y1-y0)));
  sel.transition().duration(reduce?0:800).ease(d3.easeCubicInOut).call(zoom.transform,d3.zoomIdentity.translate(L0+cw/2-kk*(x0+x1)/2,Hd/2-kk*(y0+y1)/2).scale(kk))}
function focusOn(x,y,kk){const L0=336,R0=380,cw=Wd-L0-R0;sel.transition().duration(reduce?0:900).ease(d3.easeCubicInOut).call(zoom.transform,d3.zoomIdentity.translate(L0+cw/2-kk*x,Hd/2-kk*y).scale(kk))}
$('zIn').onclick=()=>sel.transition().duration(300).call(zoom.scaleBy,1.5);
$('zOut').onclick=()=>sel.transition().duration(300).call(zoom.scaleBy,1/1.5);
$('zFit').onclick=()=>{S.path=null;fit()};

// ── picking ──
function pick(x,y){const k=T.k;
  for(const n of NOTES){if(n._lab){const [a,b,w,h]=n._lab;if(x>=a&&x<=a+w&&y>=b&&y<=b+h)return{kind:'note',id:n.id}}}
  let best=null,bd=1e9;for(const p of props){const r=pr(p)*Math.sqrt(k)*.9+8,d=Math.hypot(sx(p.x)-x,sy(p.y)-y);if(d<r&&d<bd){bd=d;best=p}}
  if(best)return best;for(const o of others){const d=Math.hypot(sx(o.x)-x,sy(o.y)-y);if(d<12)return o}return null}
const same=(a,b)=>a&&b&&a.kind===b.kind&&a.id===b.id;
cv.addEventListener('pointermove',ev=>{const h=pick(ev.clientX,ev.clientY);if(!same(h,S.hov)&&(h||S.hov)){S.hov=h;dirty=true;cv.classList.toggle('hov',!!h)}});
let down=null;cv.addEventListener('pointerdown',ev=>{down=[ev.clientX,ev.clientY]});
cv.addEventListener('click',ev=>{if(down&&Math.hypot(ev.clientX-down[0],ev.clientY-down[1])>4)return;const h=pick(ev.clientX,ev.clientY);select(h)});

// ── cards ──
const card=$('card');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function row(p,tag){return'<li><button type="button" data-go="'+p.id+'"><i style="background:'+(p.u==='not'?'transparent;box-shadow:inset 0 0 0 1.5px '+C.muted:ucol(p.u))+'"></i>'+esc(p.name)+'<small>'+(tag||NB[p.note].t.replace('Teorema di ','').split(' ').slice(0,2).join(' '))+'</small></button></li>'}
function select(x){S.sel=x;S.path=null;dirty=true;if(!x){card.classList.remove('show');return}
  let h='<button class="x" type="button" aria-label="Chiudi">×</button>';
  if(x.kind==='p'){const p=x,w=W[p.u],nt=NB[p.note];
    h+='<div class="chips"><span><i style="background:'+nt.h+'"></i>concetto</span><span>livello '+p.d+'</span></div><h3>'+esc(p.name)+'</h3><span class="word" style="color:'+ucol(p.u)+';background:'+rgba(ucol(p.u),.14)+'">'+w[0]+'</span><p class="stmt">'+esc(p.st)+'</p>';
    h+='<h4>'+(p.prov.length>1?'Compare in '+p.prov.length+' tue note: un nodo solo':'Dove compare')+'</h4><ul class="rows">'+p.prov.map((id,i)=>'<li class="s"><i style="background:'+NB[id].h+'"></i>'+esc(NB[id].t)+'<small>'+(i?'citato':'nato qui · '+esc(p.sec.split(' ')[0]))+'</small></li>').join('')+'</ul>';
    const ps=(parents[p.id]||[]).map(i=>byId[i]),ks=(kids[p.id]||[]).map(i=>byId[i]);
    if(ps.length)h+='<h4>Segue da</h4><ul class="rows">'+ps.map(q=>row(q)).join('')+'</ul>';else h+='<h4>Segue da</h4><p>È una base: non dipende da altri concetti.</p>';
    if(ks.length)h+='<h4>Porta a</h4><ul class="rows">'+ks.map(q=>row(q)).join('')+'</ul>';
    const A=[...anc[p.id]].map(i=>byId[i]),weak=A.filter(q=>q.u==='shaky'||q.u==='accepted'||q.u==='not');
    h+='<div class="acts"><button class="pri" type="button" data-a="path">Cosa serve per capirlo ('+A.length+')</button><button type="button" data-a="para">Apri il paragrafo</button><button type="button" data-a="rip">Ripassa</button></div>';
    if(A.length&&weak.length)h+='<p style="margin-top:12px">Tra le basi di questo concetto, <b>'+weak.length+' sono fragili</b>: '+weak.slice(0,3).map(q=>esc(q.name)).join(', ')+(weak.length>3?'…':'')+'.</p>'}
  else if(x.kind==='note'){const n=NB[x.id],ps=props.filter(p=>p.note===n.id),sh=props.filter(p=>p.also.includes(n.id));const cnt=u=>ps.filter(p=>p.u===u).length;
    h+='<div class="chips"><span><i style="background:'+n.h+'"></i>nota Obsidian</span><span>regione</span></div><h3>'+esc(n.t)+'</h3><div class="membar"><i style="width:'+Math.round(n.m*100)+'%;background:'+(n.m>=.7?C.good:n.m>=.5?C.warn:C.bad)+'"></i></div><p><b>'+Math.round(n.m*100)+'%</b> di memoria · prossimo ripasso '+(n.due===0?'<b>oggi</b>':n.due===1?'domani':'tra '+n.due+' giorni')+'</p>';
    h+='<h4>'+ps.length+' concetti nati qui'+(sh.length?' · '+sh.length+' condivisi':'')+'</h4><div class="mix">'+['solid','shaky','accepted','not'].map(u=>'<i style="flex:'+cnt(u)+';background:'+(u==='not'?C.hair:ucol(u))+'"></i>').join('')+'</div><p>'+cnt('solid')+' li sai · '+cnt('shaky')+' incerti · '+cnt('accepted')+' accettati · '+cnt('not')+' mai studiati</p>';
    h+='<ul class="rows">'+ps.map(q=>row(q,'livello '+q.d)).join('')+'</ul>';
    if(sh.length)h+='<h4>Presi da altre note</h4><ul class="rows">'+sh.map(q=>row(q)).join('')+'</ul>';
    const wl=WLN.filter(e=>e.includes(n.id)).map(e=>e[0]===n.id?e[1]:e[0]);h+='<h4>Link che hai scritto in Obsidian</h4><p>'+wl.map(i=>esc(NB[i].t)).join(' · ')+'</p>';
    h+='<div class="acts"><button class="pri" type="button" data-a="study">Studia questa nota</button><button type="button" data-a="open">Apri la nota</button><button type="button" data-a="zoom">Entra nella regione</button></div>'}
  else if(x.kind==='n'){h+='<div class="chips"><span><i style="background:'+scol(x.s)+'"></i>'+SUBJ[x.s][0]+'</span></div><h3>'+esc(x.name)+'</h3><p>Nota di Obsidian <b>non ancora importata</b>: quando la importi, Gemini ne estrae i concetti e le catene e diventa una regione come quelle di Analisi.</p><div class="acts"><button class="pri" type="button" data-a="import">Importa ed estrai i concetti</button></div>'}
  card.innerHTML=h;card.classList.add('show');card.querySelector('.x').onclick=()=>select(null);
  card.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const p=byId[b.dataset.go];select(p);if(T.k<1.4)focusOn(p.x,p.y,1.8)});
  card.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,x))}
function act(a,x){
  if(a==='path'){const set=new Set([x.id,...anc[x.id]]);S.path={set,root:x};dirty=true;fit([...set].map(i=>byId[i]));toast('Percorso: tutto quello che serve per capire «'+x.name+'»')}
  else if(a==='zoom'){const c=centroid(x.id);focusOn(c.x,c.y,1.9)}
  else toast({para:'Si aprirebbe la nota al paragrafo '+(x.sec||''),rip:'Si aprirebbe il Ripasso su questo concetto',study:'Si aprirebbe una sessione di Apprendimento',open:'Si aprirebbe la nota',import:'Gemini estrarrebbe concetti e catene da questa nota'}[a]||'')}
let tt;function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2600)}
addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement!==$('q')){select(null)}});

// ── controls ──
document.querySelectorAll('[data-lay]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-lay]').forEach(x=>x.setAttribute('aria-pressed',x===b));relayout(b.dataset.lay)});
document.querySelectorAll('[data-lens]').forEach(b=>b.onclick=()=>{S.lens=b.dataset.lens;document.querySelectorAll('[data-lens]').forEach(x=>x.setAttribute('aria-pressed',x===b));dirty=true});
[['tReg','reg'],['tWl','wl'],['tFr','fr']].forEach(([id,key])=>$(id).onclick=e=>{const b=e.currentTarget,on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);S[key]=on;dirty=true});
const q=$('q'),res=$('results');let hits=[],hi=-1;
function renderRes(){res.innerHTML='';hits.forEach((x,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.setAttribute('role','option');b.setAttribute('aria-selected',i===hi);
  b.innerHTML='<i style="background:'+(x.kind==='p'?ucol(x.u):x.kind==='note'?NB[x.id].h:scol(x.s))+'"></i>'+esc(x.kind==='note'?NB[x.id].t:x.name)+'<small>'+(x.kind==='p'?'concetto':'nota')+'</small>';b.onclick=()=>go(x);li.appendChild(b);res.appendChild(li)})}
function go(x){q.value='';hits=[];renderRes();if(x.kind==='p'){focusOn(x.x,x.y,1.9)}else if(x.kind==='note'){const c=centroid(x.id);focusOn(c.x,c.y,1.1)}else focusOn(x.x,x.y,1.2);select(x)}
q.addEventListener('input',()=>{const v=q.value.trim().toLowerCase();hi=-1;if(!v){hits=[];renderRes();return}
  hits=[...props.filter(p=>p.name.toLowerCase().includes(v)||p.st.toLowerCase().includes(v)),...NOTES.filter(n=>n.t.toLowerCase().includes(v)).map(n=>({kind:'note',id:n.id})),...others.filter(o=>o.name.toLowerCase().includes(v))].slice(0,8);renderRes()});
q.addEventListener('keydown',e=>{if(e.key==='ArrowDown'){hi=Math.min(hits.length-1,hi+1);renderRes();e.preventDefault()}else if(e.key==='ArrowUp'){hi=Math.max(0,hi-1);renderRes();e.preventDefault()}else if(e.key==='Enter'&&hits.length)go(hits[Math.max(0,hi)]);else if(e.key==='Escape'){q.value='';hits=[];renderRes()}});
const tb=[...document.querySelectorAll('[data-t]')];
function setTheme(t){document.documentElement.dataset.theme=t;dark=t==='lavagna';tb.forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t));readC();dirty=true;if(S.sel)select(S.sel)}
tb.forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
setTheme(matchMedia('(prefers-color-scheme: light)').matches?'trattato':'lavagna');
relayout('radial');
fit();
requestAnimationFrame(loop);
window.__g={S,byId,props,NOTES,focusOn,select,act,fit,relayout,centroid,setLens:l=>document.querySelector('[data-lens="'+l+'"]').click()};
})();
</script>
