<!DOCTYPE html>
<html lang="it" data-theme="lavagna">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pratica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--ease-out:cubic-bezier(.23,1,.32,1);--serif:'Instrument Serif',Georgia,serif;--sans:'Geist',ui-sans-serif,system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace}
[data-theme="lavagna"]{color-scheme:dark;--bg:#0f100d;--panel:#141511;--surface:#1a1b17;--hair:rgba(236,233,223,.10);--faint:rgba(236,233,223,.055);--inner:inset 0 1px 0 rgba(236,233,223,.06);
  --ink:#ece9df;--muted:#a19e92;--accent:#ef7a42;--good:#8fd1a6;--warn:#e9b95f;--bad:#ef6f6f;--s-an:#ef7a42;--s-al:#7fa8e8;--s-pr:#c9a0e6;--s-ml:#6fcabc;--s-fi:#e8737e;--s-nu:#a8d36f;--s-fa:#e2bb5c}
[data-theme="trattato"]{color-scheme:light;--bg:#f3eee4;--panel:#ede7db;--surface:#fbf8f2;--hair:rgba(36,32,27,.12);--faint:rgba(36,32,27,.05);--inner:inset 0 1px 0 rgba(255,255,255,.85);
  --ink:#221e19;--muted:#615a4f;--accent:#a83d22;--good:#2f6e48;--warn:#8f6512;--bad:#a8323f;--s-an:#a83d22;--s-al:#2f5c9e;--s-pr:#7a4b9a;--s-ml:#1f7a6c;--s-fi:#a8323f;--s-nu:#4f7a1f;--s-fa:#8f6512}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
button{font:inherit;color:inherit}
.lab{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.m{font-family:var(--serif);font-style:italic;font-size:1.15em}
.app{display:grid;grid-template-rows:auto 1fr;height:100dvh}
.top{display:flex;align-items:center;gap:16px;padding:12px 20px;border-bottom:1px solid var(--hair)}
.top h1{font:400 28px/1 var(--serif);margin:0}
.top .sp{flex:1}
.pill{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:13px;color:var(--muted)}
.body{display:grid;grid-template-columns:1fr 280px;min-height:0}
.scroll{overflow:auto;min-height:0;display:flex;flex-direction:column}
.col{width:100%;max-width:760px;margin:0 auto;padding:28px 24px 30px;flex:1}
.msg{margin:0 0 18px;animation:in .4s var(--ease-out)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg p{margin:0 0 12px}
.you{display:flex;justify-content:flex-end;margin:0 0 18px;animation:in .4s var(--ease-out)}
.you>div{max-width:82%;padding:10px 16px;border-radius:18px 18px 4px 18px;background:var(--faint);font-size:16px}
.you .lab{display:block;margin-bottom:2px}
.you .thumb{display:flex;gap:10px;align-items:center;margin-top:6px}
.paper{width:120px;border-radius:8px;background:#f6f1e3;color:#2b2a26;font:500 13px/1.25 'Caveat',cursive;padding:8px;transform:rotate(-1.5deg);box-shadow:0 6px 18px -8px rgba(0,0,0,.5)}
.card{border:1px solid var(--hair);border-radius:16px;background:var(--surface);padding:14px 16px;margin:0 0 18px;animation:in .4s var(--ease-out)}
.card .st{font-size:17px}
.chip{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.chip.ok{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)} .chip.mid{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)} .chip.no{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.hintmsg{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--warn) 8%,transparent);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);margin:0 0 18px;animation:in .4s var(--ease-out)}
.rung{flex:none;font:500 11px var(--mono);padding:3px 7px;border-radius:6px;background:var(--faint);color:var(--warn);margin-top:3px}
.verdict{font-size:15px;color:var(--muted);margin:6px 0 0}
.sol{border-top:1px solid var(--hair);margin-top:12px;padding-top:10px}
.meta{margin-top:10px;font:500 11px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.divider{display:flex;align-items:center;gap:12px;margin:24px 0;color:var(--muted)}
.divider::before,.divider::after{content:"";flex:1;border-top:1px dotted var(--hair)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{50%{opacity:.25}}
/* dock */
.dockwrap{position:sticky;bottom:0;padding:0 24px 20px;background:linear-gradient(transparent,var(--bg) 40px)}
.dock{max-width:760px;margin:0 auto}
.shell{padding:5px;border-radius:24px;background:color-mix(in srgb,var(--surface) 55%,transparent);border:1px solid var(--hair);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.inner{border-radius:19px;background:var(--surface);box-shadow:var(--inner),0 30px 60px -30px rgba(0,0,0,.6);padding:14px 16px}
.inner .st{font-size:17px;margin:4px 0 10px;max-height:120px;overflow:auto}
.work{border:1px solid var(--hair);border-radius:14px;padding:6px 12px}
.work:focus-within{border-color:var(--accent)}
.work textarea{width:100%;min-height:64px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;resize:none;outline:none}
.work textarea::placeholder{color:var(--muted);opacity:1}
.att{display:flex;gap:8px;align-items:center;margin-top:4px;flex-wrap:wrap}
.att .file{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--mono);padding:4px 10px;border-radius:999px;background:var(--faint)}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.row .sp{flex:1}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:14px;color:var(--ink)}
.ghost svg{width:16px;height:16px}
.ghost.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--warn)}
.pri{min-height:42px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font:500 15px var(--sans);cursor:pointer;transition:transform .12s var(--ease-out),opacity .2s}
.pri:active,.ghost:active{transform:scale(.97)} .pri:disabled{opacity:.35;cursor:not-allowed}
.hintk{font:500 12px var(--mono);color:var(--muted)}
.lines{display:flex;flex-direction:column;gap:6px;margin:4px 0 6px}
.lines button{display:flex;gap:12px;align-items:center;text-align:left;padding:9px 14px;border-radius:14px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:15px}
.lines button span{font:500 12px var(--mono);color:var(--muted)}
.lines button[aria-pressed="true"]{border-color:var(--ink);background:var(--faint)}
.composer{display:flex;gap:8px;align-items:center}
.composer input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none;min-height:42px;padding:0 4px}
.composer input::placeholder{color:var(--muted)}
/* material component (concepts from the graph + sources from notebooks) */
.mt-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.mt-sum{font:500 12px var(--mono);color:var(--ink);padding:3px 10px;border-radius:999px;background:var(--faint)}
.mt-head .sp{flex:1}
.mt-open{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:13px}
.mt-open svg{width:14px;height:14px}
.mt-group{margin-bottom:8px}
.mt-group>.lab{display:block;margin-bottom:6px;font-size:10px}
.mt-chips{display:flex;flex-wrap:wrap;gap:6px}
.mt-chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 6px 0 12px;border-radius:999px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:14px;transition:border-color .2s,background-color .2s,transform .12s var(--ease-out);animation:pop .25s var(--ease-out)}
.mt-chip:active{transform:scale(.97)}
.mt-chip i{width:8px;height:8px;border-radius:50%;flex:none}
.mt-chip small{font:500 11px var(--mono);color:var(--muted);padding:2px 6px;border-radius:999px;background:var(--faint)}
.mt-chip[aria-pressed="true"]{border-color:var(--ink);background:var(--faint)}
.mt-chip button{width:28px;height:28px;border-radius:50%;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.mt-chip button svg{width:10px;height:10px}
@media (hover:hover) and (pointer:fine){.mt-chip button:hover{background:var(--faint);color:var(--ink)}}
.mt-chip.more{border-style:dashed;color:var(--muted);padding:0 14px}
.mt-tag{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--faint);color:var(--muted)}
.mt-tag.due{color:var(--accent)}
.mt-hint{font-size:13px;color:var(--muted)}
.mt-toast{font-size:13px;color:var(--good);min-height:18px;margin-top:6px}
dialog.mt{padding:0;border:0;background:transparent;color:var(--ink);max-width:min(1040px,calc(100vw - 32px));width:100%;max-height:calc(100dvh - 48px)}
dialog.mt::backdrop{background:rgba(0,0,0,.55);backdrop-filter:blur(4px)}
dialog.mt[open]{animation:dlg .22s var(--ease-out)}
@keyframes dlg{from{opacity:0;transform:scale(.98) translateY(6px)}to{opacity:1;transform:none}}
.mt-dlg{display:grid;grid-template-rows:auto auto 1fr auto;height:min(720px,calc(100dvh - 48px));border-radius:24px;background:var(--surface);border:1px solid var(--hair);box-shadow:var(--inner),0 40px 100px -30px rgba(0,0,0,.7);overflow:hidden}
.mt-dh{display:flex;align-items:center;gap:12px;padding:16px 18px 8px}
.mt-dh h2{font:400 30px/1 var(--serif);margin:0}
.mt-dh .sp{flex:1}
.mt-x{width:40px;height:40px;border-radius:12px;border:0;background:transparent;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.mt-x svg{width:16px;height:16px}
.mt-tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:var(--faint)}
.mt-tabs button{min-height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.mt-tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink)}
.mt-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 18px 12px;border-bottom:1px solid var(--hair)}
.mt-search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:999px;background:var(--faint);border:1px solid transparent}
.mt-search:focus-within{border-color:var(--accent)}
.mt-search svg{width:15px;height:15px;color:var(--muted)}
.mt-search input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:15px;outline:none;min-height:40px}
.mt-filters{display:flex;gap:6px;flex-wrap:wrap}
.mt-filters button{min-height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--hair);background:transparent;cursor:pointer;font-size:13px;color:var(--muted)}
.mt-filters button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mt-cols{display:grid;grid-template-columns:1fr 300px;min-height:0}
.mt-tree{overflow:auto;padding:8px 10px 16px;scrollbar-width:thin}
.mt-sel{border-left:1px solid var(--hair);overflow:auto;padding:14px;background:var(--panel)}
.mt-tree details>summary{list-style:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:0 8px;border-radius:10px;cursor:pointer}
.mt-tree details>summary::-webkit-details-marker{display:none}
.mt-tree .chev{width:12px;height:12px;color:var(--muted);transition:transform .2s var(--ease-out);flex:none}
.mt-tree details[open]>summary .chev{transform:rotate(90deg)}
.mt-tree .cnt{margin-left:auto;font:500 11px var(--mono);color:var(--muted)}
.mt-tree .kids{margin-left:22px;border-left:1px solid var(--hair);padding-left:6px}
.mt-row{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 8px;border-radius:10px;cursor:pointer;font-size:14px}
@media (hover:hover) and (pointer:fine){.mt-row:hover,.mt-tree summary:hover{background:var(--faint)}}
.mt-cb{appearance:none;flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--hair);background:transparent;cursor:pointer;display:grid;place-items:center;margin:0}
.mt-cb:checked{background:var(--ink);border-color:var(--ink)}
.mt-cb:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--bg);border-bottom:2px solid var(--bg);transform:rotate(-45deg) translate(1px,-1px)}
.mt-cb:indeterminate{background:var(--ink);border-color:var(--ink)}
.mt-cb:indeterminate::after{content:"";width:8px;height:2px;background:var(--bg)}
.mt-mem{margin-left:auto;display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--muted)}
.mt-mem .bar{width:44px;height:4px;border-radius:4px;background:var(--faint);overflow:hidden}
.mt-mem .bar b{display:block;height:100%;border-radius:4px}
.mt-sel ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.mt-sel li{display:flex;align-items:center;gap:8px;padding:6px 6px 6px 10px;border-radius:10px;background:var(--faint);font-size:13px}
.mt-sel li i{width:7px;height:7px;border-radius:50%;flex:none}
.mt-sel li span{flex:1}
.mt-sel li button{width:28px;height:28px;border-radius:8px;border:0;background:transparent;cursor:pointer;color:var(--muted)}
.mt-files{padding:16px 18px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.mt-file{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--hair);cursor:pointer}
.mt-file .pp{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.mt-file:has(.mt-cb:checked){border-color:var(--ink);background:var(--faint)}
.mt-df{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--hair)}
.mt-df .sp{flex:1}
.mt-hidden{display:none!important}
@media (max-width:760px){.mt-cols{grid-template-columns:1fr}.mt-sel{display:none}}
/* mode chooser: training vs exam simulation */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 0}
.mode{position:relative;display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--hair);background:transparent;cursor:pointer;transition:border-color .2s ease,background-color .2s ease,transform .12s var(--ease-out)}
.mode:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.mode:hover{border-color:color-mix(in srgb,var(--ink) 30%,transparent)}}
.mode .ic{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--faint);color:var(--muted);transition:background-color .2s ease,color .2s ease}
.mode .ic svg{width:17px;height:17px}
.mode b{display:block;font-size:15px;font-weight:500;line-height:1.3}
.mode small{display:block;font-size:13px;color:var(--muted);line-height:1.4;margin-top:2px}
.mode .tick{position:absolute;top:12px;right:12px;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--hair);transition:all .2s ease}
.mode[aria-checked="true"]{border-color:var(--ink);background:var(--faint)}
.mode[aria-checked="true"] .tick{border-color:var(--ink);background:var(--ink);box-shadow:inset 0 0 0 3px var(--surface)}
.mode.exam[aria-checked="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
.mode.exam[aria-checked="true"] .ic{background:var(--accent);color:var(--bg)}
.mode.exam[aria-checked="true"] .tick{border-color:var(--accent);background:var(--accent)}
.examopts{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s var(--ease-out)}
.examopts.open{grid-template-rows:1fr}
.examopts>div{overflow:hidden}
.examrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 2px 2px}
.dur{display:flex;padding:3px;border-radius:999px;background:var(--faint);gap:2px}
.dur button{min-height:32px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:500 13px var(--mono);cursor:pointer;transition:background-color .2s,color .2s}
.dur button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--inner),0 1px 3px rgba(0,0,0,.2)}
.custom{display:none;align-items:center;gap:4px;padding:3px;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 6%,transparent)}
.custom.on{display:inline-flex;animation:pop .2s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.custom button{width:30px;height:30px;border-radius:50%;border:0;background:var(--faint);cursor:pointer;font:500 15px var(--mono);color:var(--ink);transition:transform .12s var(--ease-out)}
.custom button:active{transform:scale(.92)}
.custom input{width:52px;border:0;background:transparent;color:var(--ink);font:500 14px var(--mono);text-align:right;outline:none;-moz-appearance:textfield}
.custom input::-webkit-outer-spin-button,.custom input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.custom span{font:500 13px var(--mono);color:var(--muted);padding-right:6px}
.rules{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rules span{display:inline-flex;align-items:center;gap:6px}
.rules svg{width:13px;height:13px;color:var(--accent)}
.startrow{display:flex;align-items:center;gap:10px;margin-top:14px;border-top:1px solid var(--hair);padding-top:12px}
.startrow input{flex:1;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none;min-height:42px;padding:0 4px}
.startrow input::placeholder{color:var(--muted)}
.pri.exam{background:var(--accent);color:#fff}
.timer{display:none;font:500 13px var(--mono);padding:6px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.timer.on{display:inline-flex;align-items:center;gap:6px}
.timer.on::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
#go,.dur button{white-space:nowrap}
@media (max-width:640px){.dur button{padding:0 10px}}
@media (max-width:640px){.modes{grid-template-columns:1fr}.startrow{flex-direction:column;align-items:stretch}.startrow .pri{width:100%}}
/* side arc */
.side{border-left:1px solid var(--hair);background:var(--panel);padding:20px 16px;overflow:auto}
.arc{display:flex;flex-direction:column;gap:18px;margin-top:12px}
.arc h3{margin:0 0 6px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center}
.arc h3.on{color:var(--ink)} .arc h3.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.arc ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.arc li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:6px 10px;border-radius:10px;background:var(--faint)}
.arc li .chip{flex:none}
.arc .empty{font-size:13px;color:var(--muted)}
@media (max-width:900px){.body{grid-template-columns:1fr}.side{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="lab" style="color:var(--accent)">Prototipo · Pratica</span><h1>Pratica</h1><span class="lab" id="phase">Avvio</span><span class="sp"></span><span class="timer" id="timer" aria-label="Tempo rimanente"></span><button class="pill" id="theme" type="button">Trattato</button></div>
  <div class="body">
    <div class="scroll" id="scroll"><div class="col" id="log" aria-live="polite"></div><div class="dockwrap"><div class="dock" id="dock"></div></div></div>
    <aside class="side" aria-label="Andamento della sessione"><div class="lab">La sessione</div>
      <div class="arc">
        <div><h3 id="a1">Riscaldamento</h3><ul id="l1"><li class="empty">—</li></ul></div>
        <div><h3 id="a2">Corpo · argomenti mescolati</h3><ul id="l2"><li class="empty">—</li></ul></div>

 if($('#hint'))$('#hint').onclick=()=>onSubmit({hint:true});
 send.onclick=()=>{const t=wk.value.trim(),ph=photo;wk.value='';photo=false;$('#att').innerHTML='';upd();
  add(`<div><span class="lab">Il tuo ragionamento</span>${t||''}${ph?`<div class="thumb"><div class="paper">|sin a − sin b|<br>= |cos c| · |a − b|<br>≤ |a − b| ✓</div><span class="lab">letto dalla foto</span></div>`:''}</div>`,'you');
  onSubmit({text:t,photo:ph})};
 wk.focus();}

function conclude({outcome,cls,verdict,sol,meta}){add(`<div style="display:flex;gap:8px;align-items:center"><span class="lab">Concluso</span><span class="chip ${cls}">${outcome}</span></div><p class="verdict">${verdict}</p><div class="sol"><div class="lab">Soluzione di riferimento</div>${sol}</div><div class="meta">${meta}</div>`,'card')}
function pause(){return new Promise(res=>{dock.innerHTML=`<div class="shell"><div class="inner"><div class="composer"><input id="pq" placeholder="Domande su questo problema? Chiedi pure…"><button class="pri" id="next" type="button">Prossimo problema</button></div></div></div>`;
 $('#pq').onkeydown=async e=>{if(e.key==='Enter'&&e.target.value.trim()){const v=e.target.value;e.target.value='';add(`<div>${v}</div>`,'you');await agent('<p>Buona domanda. (Nel prototipo la risposta è simulata: qui l\'IA risponde in modo mirato, senza riaprire una lezione intera.)</p>')}};
 $('#next').onclick=()=>{dock.innerHTML='';add('<div>Prossimo problema</div>','you');res()};$('#next').focus()})}

async function run(){
 await start(); $('#phase').textContent='Riscaldamento'; arc(0);
 await agent('<p>Si parte con uno facile, per riattivare l\'argomento.</p>');
 add('<div class="lab">Problema</div><div class="st">Mostra che per ogni <span class="m">a, b</span> reali vale <span class="m">|sin a − sin b| ≤ |a − b|</span>.</div>','card');
 // problem 1 loop
 let hints=0, done=false;
 await new Promise(res=>{
  const RUNGS=[['R0','Rileggi bene la disuguaglianza: a sinistra c\'è una <b>differenza di valori</b> della stessa funzione.'],['R1','Hai una differenza di valori di <span class="m">f</span> e una differenza di punti. C\'è un risultato che le lega attraverso la derivata.'],['R2','Cerca tra i teoremi sulle funzioni derivabili in un intervallo: uno parla proprio di <span class="m">f(b) − f(a)</span>.']];
  problem({statement:'Mostra che per ogni <span class="m">a, b</span> reali vale <span class="m">|sin a − sin b| ≤ |a − b|</span>.',onSubmit:async({hint,text,photo})=>{
   if(done)return;
   if(hint){const r=RUNGS[Math.min(hints,RUNGS.length-1)];hints++;add(`<span class="rung">${r[0]}</span><div>${r[1]}</div>`,'hintmsg');return}
   const t=(text||'').toLowerCase();
   if(photo||/valor medio|lagrange|cos ?c|derivat/.test(t)){
    done=true;dock.innerHTML='';
    await agent(`<p>${photo?'Ho letto il foglio: ':''}Corretto. La mossa che regge tutto è aver visto che <span class="m">sin a − sin b</span> è una differenza di valori, e quindi il teorema del valor medio la trasforma in <span class="m">cos c · (a − b)</span>. Il resto è <span class="m">|cos c| ≤ 1</span>.</p>`);
    conclude({outcome:hints?'Risolto con aiuti':'Risolto',cls:hints?'mid':'ok',verdict:hints?`Ti è servito l'aiuto fino al gradino R${hints-1}: lo riprendiamo nel ritest con un'altra funzione.`:'Risolto senza aiuti.',sol:'<p style="margin:6px 0 0">Per il teorema del valor medio su <span class="m">[a, b]</span> esiste <span class="m">c</span> con <span class="m">sin a − sin b = cos c · (a − b)</span>. Poiché <span class="m">|cos c| ≤ 1</span>, segue <span class="m">|sin a − sin b| ≤ |a − b|</span>. ∎</p>',meta:`Modo: richiamo · aiuto massimo: ${hints?'R'+(hints-1):'nessuno'} · bersaglio non annunciato`});
    arcAdd('l1','sin è 1-lipschitziana',hints?'aiuti':'risolto',hints?'mid':'ok'); if(hints)arcAdd('l3','Valor medio · disuguaglianza','in coda','mid');
    res();
   } else {
    await agent('<p>Il tentativo di maggiorare direttamente <span class="m">sin a</span> e <span class="m">sin b</span> separatamente non porta lontano: perdi il legame con <span class="m">a − b</span>. <b>Controlla l\'idea su cui stai lavorando</b>: c\'è un modo di trattare la differenza come un unico oggetto?</p>');
   }}});
 });
 await pause(); $('#phase').textContent='Corpo'; arc(1);
 await agent('<p>Adesso cambio argomento di proposito: alternare è ciò che allena davvero il "farlo venire in mente".</p>');
 const LN=['f(x) = |x| è continua su [−1, 1]','f(−1) = f(1) = 1','Quindi per Rolle esiste c ∈ (−1, 1) con f′(c) = 0','Infatti c = 0 va bene'];
 add('<div class="lab">Problema</div><div class="st">Uno studente scrive questa dimostrazione. Dov\'è l\'errore?</div>','card');
 await new Promise(res=>{let pick=null;
  problem({statement:'Uno studente scrive questa dimostrazione. Tocca la riga con l\'errore, poi spiega perché.',extra:`<div class="lines" role="group">${LN.map((l,i)=>`<button type="button" aria-pressed="false" data-i="${i}"><span>${i+1}</span>${l}</button>`).join('')}</div>`,
   onSubmit:async({hint,text})=>{
    if(hint){add('<span class="rung">R1</span><div>Rolle ha tre ipotesi. Lo studente ne ha controllate solo due.</div>','hintmsg');return}
    dock.innerHTML='';const ok=pick===2||pick===3;
    await agent(ok?'<p>Esatto. Il passaggio 3 usa Rolle senza la derivabilità: <span class="m">|x|</span> ha uno spigolo in 0, e lì <span class="m">f′(0)</span> non esiste. La conclusione è falsa: nessun punto ha derivata nulla.</p>':'<p>Quella riga è corretta. L\'errore sta nell\'applicare Rolle: quale ipotesi non viene mai controllata?</p>');
    conclude({outcome:ok?'Risolto':'Arreso',cls:ok?'ok':'no',verdict:ok?'Hai distinto tra continuità e derivabilità: proprio la confusione che questo esercizio cercava.':'Lo rivedi nel ritest con un esempio diverso.',sol:'<p style="margin:6px 0 0">Rolle richiede che <span class="m">f</span> sia derivabile in <span class="m">(−1, 1)</span>. <span class="m">|x|</span> non è derivabile in 0, quindi il teorema non si applica (riga 3).</p>',meta:'Modo: distinzione · confondibile: continuità vs derivabilità'});
    arcAdd('l2','Rolle e |x|',ok?'risolto':'arreso',ok?'ok':'no'); if(!ok)arcAdd('l3','Ipotesi di Rolle','in coda','no');
    res();}});
  $$('.lines button').forEach(b=>b.onclick=()=>{pick=+b.dataset.i;$$('.lines button').forEach(x=>x.setAttribute('aria-pressed',x===b));$('#send').disabled=false});
 });
 await pause(); arc(2); $('#phase').textContent='Ritest';
 await agent('<p class="lab">Fine del prototipo · qui seguirebbero altri problemi mescolati e il ritest di ciò che è in coda a destra, sempre in forma nuova</p>');
}
$('#theme').onclick=()=>{const t=document.documentElement.dataset.theme==='lavagna'?'trattato':'lavagna';document.documentElement.dataset.theme=t;$('#theme').textContent=t==='lavagna'?'Trattato':'Lavagna'};
run();
})();
</script>
</body>
